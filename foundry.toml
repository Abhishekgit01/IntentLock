[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@safe-global/safe-smart-account/=lib/safe-smart-account/",
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
